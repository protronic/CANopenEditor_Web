appId: com.canopen.editor
productName: CANopen Editor Web
artifactName: canopen-editor-web-${version}-${os}-${arch}.${ext}

files:
  - dist/canopen-editor-web/browser/**/*
  - electron/**/*
  - package.json
  - electron/file-browser.html
  - assets/icons/256x256.png

directories:
  buildResources: assets
  output: release

win:
  target: [nsis, zip, portable]
  icon: assets/icons/icon.ico
  files:
    - bin/win/**/*
  asarUnpack:
    - bin/win/**/*
    - assets/icons/256x256.png

linux:
  target: [AppImage, deb, rpm, tar.gz]
  # Icon set directory: files named <size>x<size>.png (32x32 … 512x512).
  # electron-builder installs them as hicolor icons (deb/rpm) and uses the
  # largest one for the AppImage .DirIcon / embedded icon.
  icon: assets/icons
  category: Development
  synopsis: CANopen Object Dictionary Editor
  description: Edit CANopen XDD files
  maintainer: "CANopen Editor Web Team <entwicklung@protronic-gmbh.de>"
  files:
    - bin/linux/**/*
  asarUnpack:
    - bin/linux/**/*
    - assets/icons/256x256.png

mac:
  target: [dmg, zip]
  icon: assets/icons/icon.png
  category: public.app-category.developer-tools

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icons/icon.ico
  uninstallerIcon: assets/icons/icon.ico
  installerHeaderIcon: assets/icons/icon.ico
  createStartMenuShortcut: true
  shortcutName: CANopen Editor Web

appImage:
  artifactName: canopen-editor-web-${version}-linux-x64.${ext}

deb:
  artifactName: canopen-editor-web-${version}-linux-${arch}.${ext}

rpm:
  artifactName: canopen-editor-web-${version}-linux-${arch}.${ext}

compression: normal
