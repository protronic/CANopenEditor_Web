appId: com.canopen.editor
productName: CANopen Editor Web
artifactName: canopen-editor-${version}-${os}-${arch}.${ext}

files:
  - dist/canopen-editor-web/browser/**/*
  - electron/**/*
  - package.json
  - electron/file-browser.html

directories:
  buildResources: assets
  output: release

win:
  target: [nsis, zip, portable]
  icon: assets/icons/icon.ico
  files:
    - bin/win/**/*
  asarUnpack:
    - bin/win/**/*

linux:
  target: [AppImage, deb, rpm, tar.gz]
  icon: assets/icons/icon.png
  category: Development
  synopsis: CANopen Object Dictionary Editor
  description: Edit CANopen XDD files
  maintainer: "CANopen Editor Web Team <entwicklung@protronic-gmbh.de>"
  files:
    - bin/linux/**/*
  asarUnpack:
    - bin/linux/**/*

mac:
  target: [dmg, zip]
  icon: assets/icons/icon.png
  category: public.app-category.developer-tools

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icons/icon.ico
  uninstallerIcon: assets/icons/icon.ico
  installerHeaderIcon: assets/icons/icon.ico
  createStartMenuShortcut: true
  shortcutName: CANopen Editor Web

appImage:
  artifactName: canopen-editor-${version}-linux-x64.${ext}

deb:
  artifactName: canopen-editor-${version}-linux-${arch}.${ext}

rpm:
  artifactName: canopen-editor-${version}-linux-${arch}.${ext}

compression: normal
